project:
  name: pfe-downscaling-era5-cerra
  root: .

data:
  raw_dir: data/raw
  processed_dir: data/processed
  runtime_dir: data
  to_predict_dir: to_predict
  era5_default: data/era5_2021_2025.nc
  cerra_default: data/cerra_2021_2025_t2m_wgs84.nc
