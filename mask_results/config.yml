data:
  cerra_file: "../../data/cerra_2021_2025_t2m_wgs84.NC"
  era5_file: "../../data/era5_2021_2025.nc"
  predictions_dir: "../outputs/comparisons/selected_test/results_extreme90/predictions"
  variable: "t2m"

land_mask:
  file: "../../data/land_mask.nc"
  variable: "lsm"
  land_threshold: 0.5

domain:
  lat_min: 25.0
  lat_max: 36.0
  lon_min: -15.0
  lon_max: -3.0

thresholds:
  unit: "C"
  heat_threshold: 35.0
  cold_threshold: 5.0

labels:
  heat:
    event: "vague de chaleur"
    no_event: "pas de vague de chaleur"
  cold:
    event: "vague de froid"
    no_event: "pas de vague de froid"

output:
  output_dir: "../outputs/masks/event_dates"

figure_info:
  show_file_info: true
